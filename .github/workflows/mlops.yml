name: MLOps Pipeline

on:
  push:
    branches: [main]
    paths:
      - 'data/**.dvc'
      - 'src/**.py'
      - 'tests/**.py'
      - 'deploy/**'
      - 'params.yaml'
      - 'requirements.txt'
      - '.github/workflows/mlops.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  PYTHONUTF8: '1'

jobs:
  test:
    name: Unit Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run unit tests
        run: pytest tests/ -v

  train:
    name: Train
    needs: test
    runs-on: ubuntu-latest
    outputs:
      accuracy: ${{ steps.read_metrics.outputs.accuracy }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
      - name: Pull versioned data with DVC
        run: dvc pull data/train_phase1.csv data/eval.csv
      - name: Train and evaluate model
        env:
          MLFLOW_TRACKING_URI: sqlite:///mlflow-ci.db
          MLFLOW_EXPERIMENT_NAME: wine-quality-ci
        run: python src/train.py
      - name: Read metrics
        id: read_metrics
        run: |
          ACC=$(python -c "import json; print(json.load(open('outputs/metrics.json'))['accuracy'])")
          echo "accuracy=$ACC" >> "$GITHUB_OUTPUT"
      - name: Upload candidate model and evaluation
        uses: actions/upload-artifact@v4
        with:
          name: candidate-model
          path: |
            models/model.pkl
            outputs/metrics.json
            outputs/report.txt
          if-no-files-found: error

  eval:
    name: Eval
    needs: train
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: candidate-model
      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
      - name: Enforce quality and rollback gates
        env:
          CLOUD_BUCKET: ${{ secrets.CLOUD_BUCKET }}
          NEW_ACCURACY: ${{ needs.train.outputs.accuracy }}
        run: |
          python - <<'EOF'
          import json
          import os
          from google.cloud import storage

          threshold = 0.70
          new_accuracy = float(os.environ['NEW_ACCURACY'])
          if new_accuracy < threshold:
              raise SystemExit(
                  f'FAILED: accuracy {new_accuracy:.4f} < {threshold:.2f}; deploy blocked.'
              )

          bucket = storage.Client().bucket(os.environ['CLOUD_BUCKET'])
          previous_blob = bucket.blob('models/latest/metrics.json')
          if previous_blob.exists():
              previous_metrics = json.loads(previous_blob.download_as_text())
              previous_accuracy = float(previous_metrics['accuracy'])
              print(f'Previous production accuracy: {previous_accuracy:.4f}')
              if new_accuracy < previous_accuracy:
                  raise SystemExit(
                      f'ROLLBACK GATE: {new_accuracy:.4f} < {previous_accuracy:.4f}; deploy blocked.'
                  )
          else:
              print('No previous production metrics; rollback comparison skipped.')

          print(f'PASSED: accuracy {new_accuracy:.4f} >= {threshold:.2f}.')
          EOF
      - name: Promote candidate model and metrics
        env:
          CLOUD_BUCKET: ${{ secrets.CLOUD_BUCKET }}
        run: |
          python - <<'EOF'
          import os
          from google.cloud import storage

          bucket = storage.Client().bucket(os.environ['CLOUD_BUCKET'])
          for source, destination in (
              ('models/model.pkl', 'models/latest/model.pkl'),
              ('outputs/metrics.json', 'models/latest/metrics.json'),
              ('outputs/report.txt', 'models/latest/report.txt'),
          ):
              bucket.blob(destination).upload_from_filename(source)
              print(f'Uploaded gs://{bucket.name}/{destination}')
          EOF

  deploy:
    name: Deploy
    needs: eval
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Copy serving code and service definition
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          source: 'src/serve.py,deploy/mlops-serve.service'
          target: '/home/${{ secrets.VM_USER }}/deploy-stage'
          overwrite: true
      - name: Install, restart and verify service
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          script_stop: true
          script: |
            install -d /home/${{ secrets.VM_USER }}/src
            install -m 0644 /home/${{ secrets.VM_USER }}/deploy-stage/src/serve.py /home/${{ secrets.VM_USER }}/src/serve.py
            sudo install -o root -g root -m 0644 /home/${{ secrets.VM_USER }}/deploy-stage/deploy/mlops-serve.service /etc/systemd/system/mlops-serve.service
            sudo systemctl daemon-reload
            sudo systemctl enable mlops-serve
            sudo systemctl restart mlops-serve

            for i in 1 2 3 4 5; do
              if curl -sf http://localhost:8000/health; then
                echo
                echo 'Health check passed.'
                exit 0
              fi
              echo "Retry $i/5..."
              sleep 3
            done
            sudo systemctl status mlops-serve --no-pager -l
            exit 1
